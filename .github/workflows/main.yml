name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Tests run against the swig-wallet commit we deploy: the last Halborn
  # remediation commit. Rust and Solana match that commit's own CI.
  SWIG_PROGRAM_REF: ff2929bb780c14bc679ff03a20d4800b0b3b54a4
  RUST_VERSION: 1.91.0
  SOLANA_VERSION: 3.1.11

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup bun v2
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Check typecript
        run: bun typecheck

      - name: Check format
        run: bun run format

      - name: Check linting
        run: bun run lint

  tests:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup bun v2
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, rust-analyzer

      - name: Install libudev-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Update program bin
        run: bun update:program "$SWIG_PROGRAM_REF"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Packages
        run: bun run build:packages

      - name: Run Tests
        run: bun run test
