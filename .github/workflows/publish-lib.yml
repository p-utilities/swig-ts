name: Publish lib

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as @p-utilities/swig-lib (e.g. 2.1.0-p.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run --cwd packages/coder build
          bun run --cwd packages/lib build

      # The source keeps upstream's @swig-wallet/lib name because the other
      # packages in this repo depend on it; only the published copy is renamed.
      - name: Prepare package.json
        working-directory: packages/lib
        env:
          VERSION: ${{ inputs.version }}
        run: |
          coder_version=$(jq -r .version ../coder/package.json)
          jq --tab \
            --arg version "$VERSION" \
            --arg coder "$coder_version" \
            '.name = "@p-utilities/swig-lib"
             | .version = $version
             | .dependencies["@swig-wallet/coder"] = $coder
             | .publishConfig = { registry: "https://npm.pkg.github.com", access: "public" }
             | .repository = { type: "git", url: "git+https://github.com/p-utilities/swig-ts.git", directory: "packages/lib" }' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
          cat package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        working-directory: packages/lib
        run: npm publish --ignore-scripts --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
